{% extends "base.html" %}
{% block title %}Progresso{% endblock %}

{% block content %}
<div class="text-center mb-4">
    <h1>Progresso das tarefas</h1>
    <p class="text-secondary">Visualização simples do andamento.</p>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <canvas id="grafico"></canvas>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const dados = {
    pendente: {{ dados["Pendente"] }},
    andamento: {{ dados["Em andamento"] }},
    concluida: {{ dados["Concluída"] }}
};

new Chart(document.getElementById("grafico"), {
    type: "bar",
    data: {
        labels: ["Pendente", "Em andamento", "Concluída"],
        datasets: [{
            label: "Quantidade de tarefas",
            data: [dados.pendente, dados.andamento, dados.concluida]
        }]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true,
                ticks: {
                    precision: 0
                }
            }
        }
    }
});
</script>
{% endblock %}
